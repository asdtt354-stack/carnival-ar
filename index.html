<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>음악 속 동물 AR</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#000;color:#fff;font:16px/1.5 "Noto Sans KR",sans-serif;overflow:hidden}
#stage{position:fixed;inset:0;background:#111}
#cam,#fx,#tint{position:absolute;inset:0;width:100%;height:100%}
#cam{object-fit:cover;transform:scaleX(-1)}
#tint,#fx{pointer-events:none}#tint{transition:background 1s}
.title{position:absolute;left:clamp(16px,4vw,48px);top:clamp(16px,4vh,40px);text-shadow:0 2px 12px rgba(0,0,0,.7)}
.title h1{font:700 clamp(30px,5.5vw,60px)/1.05 "Gowun Batang",serif}
.title p{font-size:clamp(14px,1.6vw,18px);margin-top:6px}
.bar{position:absolute;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;padding:14px;background:linear-gradient(transparent,rgba(0,0,0,.7))}
button,label.btn{font:700 16px "Noto Sans KR",sans-serif;min-height:44px;padding:0 18px;border-radius:22px;border:1px solid rgba(255,255,255,.5);background:rgba(0,0,0,.4);color:#fff;cursor:pointer;display:inline-flex;align-items:center}
button:focus-visible,label.btn:focus-within,input:focus-visible{outline:3px solid #ffd54a;outline-offset:2px}
#name{font:16px "Noto Sans KR",sans-serif;min-height:44px;width:9em;padding:0 14px;border-radius:22px;border:1px solid rgba(255,255,255,.5);background:rgba(0,0,0,.4);color:#fff}
#name::placeholder{color:rgba(255,255,255,.7)}
/* 곡 선택 화면 */
#pick{position:absolute;inset:0;background:radial-gradient(circle at 50% 30%,#3a1d5c,#120a1f);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:20px;text-align:center}
#pick h2{font:700 clamp(30px,5vw,52px)/1.1 "Gowun Batang",serif}
#pick .sub{opacity:.85;margin-top:-16px}
.cards{display:flex;flex-wrap:wrap;gap:20px;justify-content:center}
.card{width:min(300px,80vw);padding:26px 22px;border-radius:22px;border:2px solid rgba(255,255,255,.25);cursor:pointer;color:#fff;text-align:left;display:block;font:inherit}
.card b{display:block;font:700 26px "Gowun Batang",serif;margin:10px 0 4px}
.card span{display:block;font-size:15px;opacity:.9}
.card img{height:96px;width:auto;max-width:100%;display:block;filter:drop-shadow(0 4px 8px rgba(0,0,0,.3))}
.lion{background:linear-gradient(160deg,#c8741d,#7a3b0c)}
.aqua{background:linear-gradient(160deg,#1d7fb0,#0b3557)}
.bee{background:linear-gradient(160deg,#e0a800,#5c3d00)}
.card:hover,.card:focus-visible{transform:translateY(-4px);border-color:#fff}
#shot{position:absolute;inset:0;background:rgba(0,0,0,.88);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px}
#shot img{max-width:92vw;max-height:72vh;border-radius:10px}#shot a{color:#fff}
#msg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.65);padding:20px 24px;border-radius:14px;display:none;text-align:center;max-width:90vw}
@media(max-width:600px){button,label.btn{padding:0 12px;font-size:15px}}
</style>
</head>
<body>
<div id="stage">
  <video id="cam" autoplay playsinline muted></video>
  <div id="tint"></div>
  <canvas id="fx"></canvas>
  <div class="title"><h1 id="tt"></h1><p id="ts"></p></div>
  <div class="bar">
    <button id="back">곡 고르기</button>
    <input id="name" placeholder="이름 (사진용)" maxlength="8" aria-label="사진에 넣을 이름">
    <button id="mute">음악 끄기</button>
    <label class="btn">다른 음악<input id="music" type="file" accept="audio/*" hidden></label>
    <button id="snap">사진 찍기</button>
    <button id="full">전체화면</button>
  </div>
  <div id="msg"></div>
  <div id="pick">
    <h2>음악 속 동물과 놀아요</h2>
    <p class="sub">어떤 곡에 들어가 볼까요?</p>
    <div class="cards">
      <button class="card lion" data-m="0">
        <img data-pic="lion_walk" alt="">
        <b>사자왕의 행진</b><span>나는 사자 조련사! 걸으면 사자가 따라오고, 두 팔을 번쩍 들면 "어흥!"</span>
      </button>
      <button class="card aqua" data-m="1">
        <img data-pic="fish_clown" alt="">
        <b>수족관</b><span>나는 바닷속 잠수부! 손을 천천히 움직이면 물고기들이 손끝을 따라와요.</span>
      </button>
      <button class="card bee" data-m="2">
        <img data-pic="bee1" alt="">
        <b>왕벌의 비행</b><span>나는 벌 떼 대장! 손을 빠르게 휘저으면 벌 떼가 윙윙 쫓아와요.</span>
      </button>
    </div>
    <p style="font-size:14px;opacity:.7">카드를 누르면 카메라가 켜져요 · 키보드 1, 2, 3으로도 고를 수 있어요</p>
  </div>
  <div id="shot"><img id="shotImg" alt="찍은 사진"><a id="dl" download="음악속동물.png">사진 저장하기</a><span style="font-size:14px;opacity:.8">휴대폰은 사진을 길게 눌러 저장할 수 있어요</span><button id="close">닫기</button></div>
</div>
<audio id="bgm" loop></audio>

  const side=cx>.5?-1:1;const tx=Math.min(Math.max((cx+side*.24)*W,W*.15),W*.85),ty=H*.66;
  const dx=tx-lion.x;lion.x+=dx*.05;lion.y+=(ty-lion.y)*.1;
  if(Math.abs(dx)>4){lion.face=dx>0?1:-1;lion.walk+=.22}
  const im=lion.roar>.2?PIC.lion_roar:PIC.lion_walk;if(!ok(im))return;
  const lw=Math.min(W*.42,H*.62*im.naturalWidth/im.naturalHeight),lh=lw*im.naturalHeight/im.naturalWidth;
  const bob=Math.abs(Math.sin(lion.walk))*lh*.03,r=lion.roar>0?1+lion.roar*.08:1;
  g.fillStyle='rgba(0,0,0,.25)';g.beginPath();g.ellipse(lion.x,lion.y+lh*.48,lw*.42,lh*.06,0,0,6.28);g.fill();
  g.save();g.translate(lion.x,lion.y-bob);g.scale(lion.face*r,r);g.rotate(Math.sin(lion.walk)*.02);
  g.drawImage(im,-lw/2,-lh/2,lw,lh);g.restore();
  if(camOn&&upper>.02&&t-lastRoar>2200){lastRoar=t;lion.roar=1;for(let k=0;k<3;k++)rings.push({r:20+k*30,a:1})}
  if(lion.roar>0)lion.roar-=.012;
  const hx=lion.x+lion.face*lw*.33,hy=lion.y-lh*.2;
  rings.forEach(o=>{o.r+=9;o.a-=.02;g.strokeStyle='rgba(255,220,120,'+Math.max(o.a,0)+')';g.lineWidth=6;g.beginPath();g.arc(hx,hy,o.r,0,6.28);g.stroke()});
  rings=rings.filter(o=>o.a>0);
  if(lion.roar>.3){g.save();g.font='700 '+Math.round(lw*.16)+'px "Gowun Batang",serif';g.fillStyle='#ffd54a';g.strokeStyle='#5a2a06';g.lineWidth=6;g.textAlign='center';
    g.strokeText('어흥!',hx+lion.face*lw*.15,hy-lh*.45);g.fillText('어흥!',hx+lion.face*lw*.15,hy-lh*.45);g.restore()}
  if(Math.random()<.3)confetti.push({x:rnd(0,W),y:-10,vy:rnd(1.5,3),vx:rnd(-1,1),c:['#ffd54a','#ff7a59','#fff','#e8a53a'][Math.floor(rnd(0,4))],a:rnd(0,6)});
  confetti.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.a+=.1;g.fillStyle=p.c;g.save();g.translate(p.x,p.y);g.rotate(p.a);g.fillRect(-4,-2,8,4);g.restore()});
  confetti=confetti.filter(p=>p.y<H+10);
}
let confetti=[];

/* ---------- 수족관 ---------- */
let fish=[],bubbles=[];
function initFish(){fish=[];const cols=['#ffb347','#ff6f61','#ffd54a','#7ee0ff','#c7a6ff','#9dffb0'];
  const ks=['fish_pink','fish_puffer','fish_blue','fish_clown'];
  for(let i=0;i<16;i++)fish.push({x:rnd(0,W),y:rnd(H*.2,H*.85),vx:rnd(-1,1),vy:0,s:rnd(.7,1.25),c:cols[i%cols.length],k:ks[i%4],ph:rnd(0,6)})}
function drawAqua(t){
  // 해초·산호
  const sw=PIC.seaweed,co=PIC.coral;
  for(let i=0;i<6;i++){const im=i%2?co:sw;if(!ok(im))continue;const bh=H*(i%2?.2:.32),bw=bh*im.naturalWidth/im.naturalHeight,bx=(i+.5)/6*W;
    g.save();g.translate(bx,H);if(!(i%2))g.transform(1,0,Math.sin(t/1200+i)*.08,1,0,0);g.drawImage(im,-bw/2,-bh,bw,bh);g.restore()}
  // 목표: 움직임이 있으면 그곳, 없으면 천천히 돌기
  const active=camOn&&amt>.004;
  fish.forEach((f,i)=>{
    const tx=active?cx*W+Math.cos(i*1.7+t/800)*90:W/2+Math.cos(t/4000+i)*W*.38,
          ty=active?cy*H+Math.sin(i*2.3+t/700)*70:H*.55+Math.sin(t/3000+i*1.3)*H*.25;
    f.vx+=(tx-f.x)*.0009;f.vy+=(ty-f.y)*.0009;f.vx*=.97;f.vy*=.97;
    const sp=Math.hypot(f.vx,f.vy),mx=active?5:2.2;if(sp>mx){f.vx*=mx/sp;f.vy*=mx/sp}
    f.x+=f.vx;f.y+=f.vy;f.ph+=.2;
    const dir=f.vx>=0?1:-1,im=PIC[f.k],fw=f.s*Math.min(W,H)/5.5;
    g.save();g.translate(f.x,f.y);g.scale(dir,1);g.rotate(Math.atan2(f.vy,Math.abs(f.vx))*.5);g.scale(1,1+Math.sin(f.ph)*.04);
    if(ok(im)){const fh=fw*im.naturalHeight/im.naturalWidth;g.drawImage(im,-fw/2,-fh/2,fw,fh)}
    g.restore();
  });
  // 물방울: 평소엔 조금, 움직이는 곳에서 많이
  if(Math.random()<.15)bubbles.push({x:rnd(0,W),y:H+10,r:rnd(3,9),vy:rnd(.8,1.8)});
  if(camOn)for(let k=0;k<3;k++){const i=Math.floor(Math.random()*MW*MH);if(motion[i]>.5)bubbles.push({x:(1-(i%MW+.5)/MW)*W,y:(Math.floor(i/MW)+.5)/MH*H,r:rnd(3,10),vy:rnd(1,2.5)})}
  if(bubbles.length>300)bubbles.splice(0,bubbles.length-300);
  bubbles.forEach(b=>{b.y-=b.vy;b.x+=Math.sin(b.y/30)*.6;g.strokeStyle='rgba(210,240,255,.8)';g.lineWidth=1.6;g.beginPath();g.arc(b.x,b.y,b.r,0,6.28);g.stroke();
    g.fillStyle='rgba(255,255,255,.5)';g.beginPath();g.arc(b.x-b.r*.35,b.y-b.r*.35,b.r*.25,0,6.28);g.fill()});
  bubbles=bubbles.filter(b=>b.y>-20);
  // 물결 빛
  g.fillStyle='rgba(180,230,255,.07)';for(let i=0;i<5;i++){const x=(i/5*W+t/30)%(W+200)-100;g.beginPath();g.moveTo(x,0);g.lineTo(x+60,0);g.lineTo(x+220,H);g.lineTo(x+120,H);g.fill()}
}

/* ---------- 왕벌 ---------- */
let bees=[],trail=[];
function initBees(){bees=[];for(let i=0;i<22;i++)bees.push({x:rnd(0,W),y:rnd(0,H),vx:0,vy:0,s:rnd(.7,1.2),ph:rnd(0,6),k:i===0})}
function drawBees(t){
  // 꿀벌집 무늬 배경
  g.strokeStyle='rgba(255,200,40,.12)';g.lineWidth=2;const hs=Math.min(W,H)/12;
  for(let row=0;row*hs*1.5<H+hs;row++)for(let col=0;col*hs*1.73<W+hs;col++){const x=col*hs*1.73+(row%2?hs*.87:0),y=row*hs*1.5;g.beginPath();
    for(let k=0;k<6;k++){const a=k/6*6.28+.52;g.lineTo(x+Math.cos(a)*hs,y+Math.sin(a)*hs)}g.closePath();g.stroke()}
  const active=camOn&&amt>.004,fast=amt>.03;
  const tx0=active?cx*W:W/2+Math.cos(t/1100)*W*.35,ty0=active?cy*H:H/2+Math.sin(t/700)*H*.3;
  bees.forEach((b,i)=>{
    const tx=tx0+Math.cos(i*2.1+t/250)*(70+i*9),ty=ty0+Math.sin(i*1.7+t/230)*(50+i*6);
    const acc=fast?.006:.0025;b.vx+=(tx-b.x)*acc+rnd(-.6,.6);b.vy+=(ty-b.y)*acc+rnd(-.6,.6);b.vx*=.93;b.vy*=.93;
    const mx=fast?14:7,sp=Math.hypot(b.vx,b.vy);if(sp>mx){b.vx*=mx/sp;b.vy*=mx/sp}
    b.x+=b.vx;b.y+=b.vy;b.ph+=.9;
    if(i%3===0)trail.push({x:b.x,y:b.y,a:.5});
    const dir=b.vx>=0?1:-1,im=PIC[['bee3','bee1','bee2','bee1'][Math.floor(b.ph/1.5)%4]],bw=b.s*Math.min(W,H)/7;
    if(ok(im)){const bh=bw*im.naturalHeight/im.naturalWidth;g.save();g.translate(b.x,b.y+Math.sin(b.ph*.5)*3);g.scale(dir,1);g.rotate(b.vy*.02);g.drawImage(im,-bw/2,-bh/2,bw,bh);g.restore()}
  });
  trail.forEach(p=>{p.a-=.03;g.fillStyle='rgba(255,220,90,'+Math.max(p.a,0)+')';g.beginPath();g.arc(p.x,p.y,2,0,6.28);g.fill()});
  trail=trail.filter(p=>p.a>0);if(trail.length>500)trail.splice(0,trail.length-500);
  if(fast){g.save();g.font='700 '+Math.round(Math.min(W,H)/12)+'px "Gowun Batang",serif';g.fillStyle='rgba(255,215,60,.9)';g.textAlign='center';
    g.fillText('윙윙윙~',tx0+Math.sin(t/90)*8,ty0-Math.min(W,H)/5);g.restore()}
}

function tick(t){
  readMotion();g.clearRect(0,0,W,H);
  if(mode===0)drawLion(t);else if(mode===1)drawAqua(t);else if(mode===2)drawBees(t);
  document.querySelectorAll('img[data-pic]').forEach(e=>e.src=IMG[e.dataset.pic]);
requestAnimationFrame(tick);
}

async function startCam(){
  if(camOn)return;
  try{const st=await navigator.mediaDevices.getUserMedia({video:{width:1280,height:720,facingMode:'user'},audio:false});cam.srcObject=st;camOn=true}
  catch(e){const m=$('msg');m.innerHTML='<p><b>카메라를 켤 수 없어요</b></p><p style="font-size:14px;opacity:.85;margin-top:6px">주소창의 카메라 권한을 허용해 주세요. 그동안 동물만 미리 볼 수 있어요.</p><button style="margin-top:12px">확인</button>';m.style.display='block';m.querySelector('button').onclick=()=>m.style.display='none'}
}
function choose(i){
  mode=i;const m=M[i];$('tt').textContent=m.t;$('ts').textContent=m.by+' · '+m.d;
  $('tint').style.background=m.tint;$('pick').style.display='none';
  lion.x=W*.75;lion.y=H*.72;rings=[];confetti=[];bubbles=[];if(i===1)initFish();if(i===2){initBees();trail=[]}
  startCam();if(songs[i]){bgm.src=songs[i];bgm.currentTime=0;bgm.play().catch(()=>{const m=$('msg');m.innerHTML='<p><b>음악이 재생되지 않았어요</b></p><p style="font-size:14px;opacity:.85;margin-top:6px">music 폴더가 이 파일 옆에 있는지 확인해 주세요.</p><button style="margin-top:12px">확인</button>';m.style.display='block';m.querySelector('button').onclick=()=>m.style.display='none'})}else bgm.pause();
}
document.querySelectorAll('.card').forEach(c=>c.onclick=()=>choose(+c.dataset.m));
$('back').onclick=()=>{$('pick').style.display='flex';mode=-1;bgm.pause()};
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='1')choose(0);if(e.key==='2')choose(1);if(e.key==='3')choose(2)});
const bgm=$('bgm'),songs=['music/lion.mp3','music/aquarium.mp3','music/bee.mp3'];
$('music').onchange=e=>{const f=e.target.files[0];if(f&&mode>=0){songs[mode]=URL.createObjectURL(f);bgm.src=songs[mode];bgm.play().catch(()=>{})}};
$('mute').onclick=()=>{if(bgm.paused){bgm.play().catch(()=>{});$('mute').textContent='음악 끄기'}else{bgm.pause();$('mute').textContent='음악 켜기'}};
$('full').onclick=()=>{const p=document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();p?.catch?.(()=>{})};

$('snap').onclick=()=>{
  if(mode<0)return;
  const c=document.createElement('canvas');c.width=W*DPR;c.height=H*DPR;const x=c.getContext('2d');
  if(camOn&&cam.videoWidth){const vr=cam.videoWidth/cam.videoHeight,sr=W/H;let sw=cam.videoWidth,sh=cam.videoHeight,sx=0,sy=0;
    if(vr>sr){sw=sh*sr;sx=(cam.videoWidth-sw)/2}else{sh=sw/sr;sy=(cam.videoHeight-sh)/2}
    x.save();x.translate(c.width,0);x.scale(-1,1);x.drawImage(cam,sx,sy,sw,sh,0,0,c.width,c.height);x.restore()}
  else{x.fillStyle='#222';x.fillRect(0,0,c.width,c.height)}
  x.fillStyle=['rgba(160,80,10,.22)','rgba(10,80,140,.3)','rgba(200,150,0,.2)'][mode];x.fillRect(0,0,c.width,c.height);
  x.drawImage(fx,0,0);x.scale(DPR,DPR);
  const nm=$('name').value.trim();
  x.fillStyle='#fff';x.shadowColor='rgba(0,0,0,.7)';x.shadowBlur=10;
  x.font='700 40px "Gowun Batang",serif';x.fillText(M[mode].role+(nm?' '+nm:''),28,H-70);
  x.font='16px "Noto Sans KR",sans-serif';x.fillText(M[mode].by+' 〈'+M[mode].t+'〉',30,H-40);
  const url=c.toDataURL('image/png');$('shotImg').src=url;$('dl').href=url;$('shot').style.display='flex';
};
$('close').onclick=()=>$('shot').style.display='none';
requestAnimationFrame(tick);
}
</script>
</body>
